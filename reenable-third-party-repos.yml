---
# =============================================================================
# Playbook : reenable-third-party-repos.yml
# Purpose  : After a 22.04 -> 24.04 release upgrade, do-release-upgrade
#            disables every third-party APT source (PPAs, Docker, Grafana,
#            HashiCorp, ...). This playbook:
#
#              1. Finds sources the upgrader disabled, in both classic
#                 one-line format (*.list, commented out with a
#                 "# disabled on upgrade to noble" marker) and deb822
#                 format (*.sources, set to "Enabled: no").
#              2. Re-enables them (keeping a .bak of every file it edits).
#              3. Rewrites the suite "jammy" -> "noble" (repos that use a
#                 fixed suite like "stable" are left untouched, and so are
#                 signing-key filenames that happen to contain the codename).
#              4. Runs apt-get update and reports any repository that does
#                 not serve noble yet, so you can deal with those by hand.
#
# Usage    : ansible-playbook reenable-third-party-repos.yml
#            ansible-playbook reenable-third-party-repos.yml -e rewrite_codename=false
#            ansible-playbook reenable-third-party-repos.yml -e repo_batch=25%
# =============================================================================

- name: Re-enable third-party APT repositories after upgrade to Ubuntu 24.04
  hosts: ubuntu_servers
  become: true
  serial: "{{ repo_batch | default('100%') }}"
  max_fail_percentage: "{{ max_fail_pct | default(100) }}"
  gather_facts: true

  vars:
    old_codename: jammy
    new_codename: noble
    rewrite_codename: true     # set false to re-enable without touching suites

    # Whether to switch the upgrader-disabled third-party sources back on.
    # Set false to leave them off and only make the repositories that are
    # already enabled serve the new release:
    #   ansible-playbook reenable-third-party-repos.yml -e reenable_third_party=false
    reenable_third_party: true

    # Repoint sources that are already enabled but still name the old
    # codename. Independent of reenable_third_party, and the part that
    # matters when third-party repos are staying disabled.
    rewrite_enabled_sources: true

    # Repair source lines that wrap the URI in double quotes. apt has never
    # supported that, so such an entry is unambiguously malformed and blocks
    # apt-get update entirely. Set false to only report them.
    fix_quoted_uris: true
    sources_dir: /etc/apt/sources.list.d

    # Source files that must NOT have their codename rewritten, as regexes
    # matched against the file path. Some vendors pin the old codename into
    # the repository PATH as part of a build identifier — e.g.
    #   deb http://mirror.example.com/apt/fluentbit/jammy-4.0.0 ./
    # where there is no "noble-4.0.0" to move to. Rewriting those silently
    # points the host at a URL that does not exist. There is no safe way to
    # tell these apart automatically: "jammy-4.0.0" and "jammy-updates" are
    # the same shape, and one must be rewritten while the other must not.
    codename_rewrite_exclude: []

    # Repositories that must be present and resolving once this playbook has
    # run, as "SITE SUITE" substrings matched against `apt-get indextargets`.
    # Use it to hold upgraded hosts to a known-good 24.04 repository set.
    # Empty disables the check.
    expected_repos: []

    # Lines that mean a repository is genuinely unusable. apt reports a real
    # signing failure as "E: The repository ... is not signed", so ^E: covers
    # the unverifiable case without having to guess at wordings.
    apt_error_patterns:
      - '^Err:'
      - '^E: '

    # Lines worth surfacing but NOT worth failing a host over. The legacy
    # trusted.gpg deprecation is the big one: apt still uses those keys and
    # the repository works, so treating it as an error fails every host that
    # has an older internal mirror — a fleet-wide false positive.
    apt_warning_patterns:
      - '^W: .*Key is stored in legacy trusted\.gpg keyring'
      - '^W: .*(NO_PUBKEY|not signed|no longer signed)'
    fail_on_apt_warnings: false

  tasks:

    - name: Abort if host is not running Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '>=')
        fail_msg: >-
          Host reports {{ ansible_distribution }}
          {{ ansible_distribution_version }} — run the upgrade playbook first.

    # -------------------------------------------------------------------
    # Classic one-line sources (*.list) — the upgrader comments the line
    # out and appends "# disabled on upgrade to noble".
    # -------------------------------------------------------------------
    - name: Find .list files disabled by the release upgrader
      ansible.builtin.find:
        paths: "{{ sources_dir }}"
        patterns: '*.list'
        file_type: file
        contains: '(?i).*disabled on upgrade.*'
      register: disabled_list_files

    - name: Re-enable commented-out entries in .list files
      ansible.builtin.replace:
        path: "{{ item.path }}"
        # [ \t]* rather than \s* at the end: \s* is greedy across newlines and
        # would swallow the file's final newline.
        regexp: '^#[ \t]*(deb(?:-src)?[ \t]+[^#\n]*?)[ \t]*#[ \t]*disabled on upgrade to[ \t]+\S+[ \t]*$'
        replace: '\1'
        backup: true
      loop: "{{ disabled_list_files.files if (reenable_third_party | bool) else [] }}"
      loop_control:
        label: "{{ item.path }}"

    # -------------------------------------------------------------------
    # deb822 sources (*.sources) — the upgrader flips "Enabled: yes" to
    # "Enabled: no" and leaves a disabled-on-upgrade comment.
    # -------------------------------------------------------------------
    - name: Find .sources files disabled by the release upgrader
      ansible.builtin.find:
        paths: "{{ sources_dir }}"
        patterns: '*.sources'
        file_type: file
        contains: '(?i).*disabled on upgrade.*'
      register: disabled_sources_files

    - name: Re-enable deb822 sources
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^Enabled:[ \t]*no[ \t]*$'
        replace: 'Enabled: yes'
        backup: true
      loop: "{{ disabled_sources_files.files if (reenable_third_party | bool) else [] }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Collect every file we re-enabled
      ansible.builtin.set_fact:
        reenabled_files: >-
          {{ (disabled_list_files.files + disabled_sources_files.files)
             if (reenable_third_party | bool) else [] }}

    - name: Report the disabled repositories that were deliberately left off
      ansible.builtin.debug:
        msg: |
          reenable_third_party is false, so these upgrader-disabled sources
          were left disabled on {{ inventory_hostname }}:
          {{ (disabled_list_files.files + disabled_sources_files.files)
             | map(attribute='path') | list | join(', ') }}
      when:
        - not (reenable_third_party | bool)
        - (disabled_list_files.files + disabled_sources_files.files) | length > 0

    # Runs over both formats: a .list file can carry the marker on its own
    # line as well as inline, and the inline form is already gone by now.
    - name: Drop the upgrader's "disabled on upgrade" marker comments
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '^#.*[Dd]isabled on upgrade.*$'
        state: absent
      loop: "{{ reenabled_files }}"
      loop_control:
        label: "{{ item.path }}"

    # -------------------------------------------------------------------
    # Point the re-enabled repos at noble
    # -------------------------------------------------------------------
    # The negative lookahead keeps the rewrite off signing-key filenames:
    # "signed-by=/usr/share/keyrings/jammy-archive.gpg" must NOT become
    # "noble-archive.gpg", or the repo ends up pointing at a keyring that
    # does not exist. Suites (jammy, jammy-updates) and codenames embedded
    # in URLs are still rewritten.
    # Repositories that are ALREADY enabled but still name the old codename:
    # these are left behind by an upgrade regardless of whether anything was
    # re-enabled, and they are the ones that matter when third-party repos are
    # deliberately staying off. ^[^#] restricts the match to active lines, so
    # commented-out entries are not resurrected by a codename rewrite.
    - name: Find enabled sources still pointing at {{ old_codename }}
      ansible.builtin.find:
        paths: "{{ sources_dir }}"
        patterns:
          - '*.list'
          - '*.sources'
        file_type: file
        contains: '^[^#]*\b{{ old_codename }}\b'
      register: stale_codename_files
      when: rewrite_enabled_sources | bool

    # Dedupe on the path, not the dict: the two find calls return the same
    # file with different mtime/checksum metadata, so `unique` over the dicts
    # would leave a duplicate and rewrite it twice.
    - name: Build the list of files to repoint at {{ new_codename }}
      ansible.builtin.set_fact:
        rewrite_candidates: >-
          {{ (reenabled_files + (stale_codename_files.files | default([])))
             | map(attribute='path') | unique | list }}

    - name: Hold back the sources excluded from the codename rewrite
      ansible.builtin.set_fact:
        rewrite_targets: >-
          {{ rewrite_candidates
             if (codename_rewrite_exclude | length == 0)
             else (rewrite_candidates
                   | reject('search', codename_rewrite_exclude | join('|'))
                   | list) }}
        rewrite_skipped: >-
          {{ []
             if (codename_rewrite_exclude | length == 0)
             else (rewrite_candidates
                   | select('search', codename_rewrite_exclude | join('|'))
                   | list) }}

    - name: Report sources deliberately kept on {{ old_codename }}
      ansible.builtin.debug:
        msg: |
          These sources match codename_rewrite_exclude and keep their
          {{ old_codename }} path — a vendor that pins the codename into the
          repository URL usually has no {{ new_codename }} equivalent:
            {{ rewrite_skipped | join(', ') }}
      when: rewrite_skipped | length > 0

    - name: Rewrite suite {{ old_codename }} -> {{ new_codename }}
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '\b{{ old_codename }}\b(?![\w.+-]*\.(?:gpg|asc|key|pgp))'
        replace: '{{ new_codename }}'
        backup: true
      loop: "{{ rewrite_targets }}"
      when: rewrite_codename | bool

    - name: Show what changed on this host
      ansible.builtin.debug:
        msg: |
          Re-enabled: {{ reenabled_files | map(attribute='path') | list
                         | default(['nothing'], true) }}
          Repointed at {{ new_codename }}:
            {{ rewrite_targets | default(['nothing'], true) }}

    # -------------------------------------------------------------------
    # Verify every repository actually serves noble
    # -------------------------------------------------------------------
    # apt does not support quoting the URI. It takes the quote as part of the
    # scheme and reports the near-undebuggable
    #   E: The method driver /usr/lib/apt/methods/"http could not be found
    # so name the offending files rather than leaving that to be decoded.
    - name: Look for source entries with a quoted URI
      ansible.builtin.shell:
        cmd: |
          grep -rlE '^[[:space:]]*(deb|deb-src)[[:space:]]+.*"|^[[:space:]]*URIs:[[:space:]]*"' \
            /etc/apt/sources.list {{ sources_dir }} 2>/dev/null || true
        executable: /bin/bash
      register: quoted_uris
      changed_when: false
      failed_when: false

    - name: Record which files carry a quoted URI
      ansible.builtin.set_fact:
        quoted_uri_paths: "{{ quoted_uris.stdout_lines | default([]) | select | list }}"

    # Surgical, not a blanket quote strip: only the URI field on deb/deb-src
    # lines and on deb822 URIs: lines. Neither format uses quotes for anything
    # legitimate, but a whole-file sed would also hit option values and
    # comments. Backups are kept next to each file.
    - name: Unquote the URI on one-line deb entries
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([ \t]*deb(?:-src)?[ \t]+(?:\[[^\]]*\][ \t]*)?)"([^"]*)"'
        replace: '\1\2'
        backup: true
      loop: "{{ quoted_uri_paths }}"
      when: fix_quoted_uris | bool

    - name: Unquote the URI on deb822 entries
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([ \t]*URIs:[ \t]*)"([^"]*)"'
        replace: '\1\2'
        backup: true
      loop: "{{ quoted_uri_paths }}"
      when: fix_quoted_uris | bool

    - name: Report the source files whose URI was quoted
      ansible.builtin.debug:
        msg: |
          These apt sources wrapped the URI in double quotes, which apt does
          not support - it reads the quote as part of the scheme and reports
          'The method driver /usr/lib/apt/methods/"http could not be found':
            {{ quoted_uri_paths | join(', ') }}
          {{ 'They have been repaired (a .bak of each is alongside).'
             if (fix_quoted_uris | bool)
             else 'fix_quoted_uris is false, so they were left as-is and
                   apt-get update will fail on them.' }}
      when: quoted_uri_paths | length > 0

    - name: Refresh apt cache against the re-enabled repositories
      ansible.builtin.command:
        cmd: apt-get update
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_update
      changed_when: true
      failed_when: false

    - name: Sort the apt-get update output into errors and warnings
      ansible.builtin.set_fact:
        apt_output_lines: >-
          {{ (apt_update.stdout_lines | default([]))
             + (apt_update.stderr_lines | default([])) }}

    - name: Split the errors from the advisory warnings
      ansible.builtin.set_fact:
        failed_repos: >-
          {{ apt_output_lines | select('search', apt_error_patterns | join('|'))
             | list }}
        warned_repos: >-
          {{ apt_output_lines | select('search', apt_warning_patterns | join('|'))
             | list }}

    # Must be double-quoted YAML scalars: inside a literal block ("|") the \n
    # stays a backslash-n and the report comes out on one run-together line.
    - name: Render each list as one line per entry
      ansible.builtin.set_fact:
        failed_repos_text: "{{ failed_repos | join('\n') }}"
        warned_repos_text: "{{ warned_repos | join('\n') }}"

    # Reported, deliberately not fatal. The legacy trusted.gpg keyring is
    # deprecated but still honoured by apt, so the repository works today —
    # failing the host over it would fail every host with an older internal
    # mirror. Set -e fail_on_apt_warnings=true to treat these as errors.
    - name: Report advisory warnings from apt-get update
      ansible.builtin.debug:
        msg: |
          apt-get update raised warnings on {{ inventory_hostname }}. These are
          NOT failures — the repositories work — but they are worth scheduling:
          {{ warned_repos_text }}

          For "Key is stored in legacy trusted.gpg keyring", migrate the key:
            sudo apt-key export <KEYID> | sudo gpg --dearmour \
              -o /etc/apt/keyrings/<name>.gpg
          then add signed-by=/etc/apt/keyrings/<name>.gpg to the source entry.
      when: warned_repos | length > 0

    - name: Fail on repositories that are genuinely broken
      ansible.builtin.fail:
        msg: |
          apt-get update reported errors on {{ inventory_hostname }}.
          These repositories are unusable — they may not publish
          {{ new_codename }} yet, may have a malformed source line, or may need
          their signing key re-imported. Fix or remove them in
          {{ sources_dir }}/. A .bak of every file this playbook touched is
          next to the original.
          {{ failed_repos_text | default('', true) | trim
             | default('(apt-get update exited ' ~ apt_update.rc
                       ~ ' without a recognisable error line — full output above)',
                       true) }}
      # rc is kept as a backstop so an error whose wording does not match
      # apt_error_patterns still fails the host. apt-get update exits 0 when it
      # only emits warnings, so this does not re-introduce the false positive.
      when: >-
        failed_repos | length > 0
        or apt_update.rc != 0
        or (fail_on_apt_warnings | bool and warned_repos | length > 0)

    # -------------------------------------------------------------------
    # Hold the host to a known-good repository set
    # -------------------------------------------------------------------
    # apt-get indextargets reports what apt is actually configured against,
    # which is the honest answer — it reflects the merged effect of
    # sources.list, sources.list.d and any deb822 stanzas, rather than what
    # the files look like.
    - name: Enumerate the repositories apt is configured against
      ansible.builtin.shell:
        cmd: |
          apt-get indextargets --no-release-info --format '$(SITE) $(RELEASE)' \
            | sort -u
        executable: /bin/bash
      register: configured_repos
      changed_when: false
      failed_when: false
      when: expected_repos | length > 0

    - name: Work out which expected repositories are missing
      ansible.builtin.set_fact:
        missing_repos: >-
          {{ expected_repos | reject('in', configured_repos.stdout | default(''))
             | list }}
      when: expected_repos | length > 0

    - name: Show the repositories apt is configured against
      ansible.builtin.debug:
        var: configured_repos.stdout_lines
      when: expected_repos | length > 0

    # Double-quoted scalars so \n is a real newline; inside the literal block
    # below it would stay a backslash-n.
    - name: Render the repository comparison
      ansible.builtin.set_fact:
        missing_repos_text: "{{ missing_repos | default([]) | join('\n  ') }}"
        configured_repos_text: "{{ configured_repos.stdout_lines | default([]) | join('\n  ') }}"
      when: expected_repos | length > 0

    - name: Fail if the host does not match the expected repository set
      ansible.builtin.fail:
        msg: |
          {{ inventory_hostname }} is missing repositories that the expected
          24.04 set requires:
            {{ missing_repos_text }}
          Configured instead:
            {{ configured_repos_text }}
      when:
        - expected_repos | length > 0
        - missing_repos | length > 0

    - name: Report success
      ansible.builtin.debug:
        msg: >-
          All APT repositories on {{ inventory_hostname }} are enabled and
          resolving{{ ' and match the expected set'
                      if (expected_repos | length > 0) else '' }}.
