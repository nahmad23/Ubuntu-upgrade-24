[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
forks = 20
timeout = 60
stdout_callback = yaml
log_path = ./ansible-upgrade.log

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=20
retries = 3
