[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
forks = 20
timeout = 60
; Readable per-task output. The old `stdout_callback = yaml` pointed at
; community.general.yaml, which was removed in community.general 12.0.0;
; ansible-core 2.13+ does this natively. Note the ini key is
; callback_result_format, not result_format (that is the option's name).
stdout_callback = default
callback_result_format = yaml
log_path = ./ansible-upgrade.log

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=20
retries = 3
