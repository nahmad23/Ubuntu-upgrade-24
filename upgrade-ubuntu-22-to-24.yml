---
# =============================================================================
# Playbook : upgrade-ubuntu-22-to-24.yml
# Purpose  : Fully unattended in-place upgrade of Ubuntu 22.04 LTS (Jammy)
#            to Ubuntu 24.04 LTS (Noble) across a fleet of servers.
#
# Usage    : ansible-playbook -i inventory/hosts.ini upgrade-ubuntu-22-to-24.yml
#
# Batching : Upgrades run in rolling batches (default 10% of the fleet at a
#            time). Override at runtime:
#              ansible-playbook ... -e upgrade_batch=5
#              ansible-playbook ... -e upgrade_batch=25%
#
# Prompts  : Every interactive prompt the upgrade can raise is answered
#            automatically with the *safe* (keep-what-you-have) answer:
#              * dpkg conffile conflicts -> --force-confdef --force-confold
#                (keep the config already on disk, never overwrite it)
#              * ucf-managed configs     -> UCF_FORCE_CONFOLD=1
#              * "restart services?"     -> debconf preseed + needrestart 'a'
#              * "new kernel available"  -> needrestart kernelhints disabled
#              * apt-listchanges pager   -> APT_LISTCHANGES_FRONTEND=none
#            These overrides are dropped into place before the upgrade and
#            REMOVED again afterwards (see the `always:` block), so hosts are
#            not left permanently answering config questions on their own.
# =============================================================================

- name: Upgrade Ubuntu 22.04 LTS to 24.04 LTS (unattended)
  hosts: ubuntu_servers
  become: true
  serial: "{{ upgrade_batch | default('10%') }}"
  max_fail_percentage: "{{ max_fail_pct | default(20) }}"
  gather_facts: true

  vars:
    # Pin the interpreter to the unversioned symlink, which exists on both
    # 22.04 and 24.04. Ansible's default discovery resolves a *versioned*
    # path (/usr/bin/python3.10 on jammy) and caches it for the whole play —
    # but the release upgrade replaces python3.10 with python3.12 underneath
    # us, so every task after do-release-upgrade dies with
    #   /bin/sh: 1: /usr/bin/python3.10: not found     (rc=127)
    # including the always: block that removes the temporary overrides and
    # unmasks the apt timers. Left that way, the host silently stops taking
    # security updates.
    ansible_python_interpreter: /usr/bin/python3

    required_free_space_mb: 10240        # 10 GB free on / before we start
    required_boot_free_space_mb: 500     # /boot must fit the new kernel+initrd
    dist_upgrade_timeout: 3600           # 1 hour for the pre-upgrade dist-upgrade
    release_upgrade_timeout: 7200        # 2 hours for do-release-upgrade

    # How often Ansible asks "are you done yet?". This is the check interval,
    # NOT how long the upgrade takes — lowering it does not speed anything up,
    # it just detects completion sooner and prints progress lines more often.
    # The *_timeout values above are what actually cap the runtime.
    dist_upgrade_poll: 15
    release_upgrade_poll: 15
    reboot_timeout: 1200                 # 20 min for the post-upgrade reboot
    lock_wait_timeout: 900               # 15 min waiting for the dpkg lock
    fail_on_held_packages: true          # held packages make the upgrader bail
    check_upgrade_tool_reachable: true   # verify archive.ubuntu.com is allowed
    merge_usr: true                      # 24.04 refuses an unmerged /usr
    fail_on_cleanup_errors: false        # post-upgrade tidy-up is not the upgrade
    archive_check_url: ''                # empty => derive from the host's mirror
    archive_check_timeout: 15

    # Written to /etc/apt/apt.conf.d and /etc/needrestart/conf.d for the
    # duration of the upgrade only, then removed again.
    apt_noninteractive_conf: /etc/apt/apt.conf.d/99-ansible-release-upgrade
    needrestart_conf: /etc/needrestart/conf.d/99-ansible-release-upgrade.conf

    apt_noninteractive_env:
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical          # only ask truly critical questions
      NEEDRESTART_MODE: a                # auto-restart services, never prompt
      APT_LISTCHANGES_FRONTEND: none
      UCF_FORCE_CONFOLD: '1'             # ucf keeps the on-disk config file
      RELEASE_UPGRADER_NO_SCREEN: '1'    # never re-exec inside screen(1)

    # debconf questions that otherwise pop a whiptail dialog mid-upgrade and
    # block forever. "restart-without-asking = true" is the safe answer for a
    # server fleet: services are restarted rather than left running against
    # deleted libraries.
    debconf_preseed:
      - 'libc6 libraries/restart-without-asking boolean true'
      - 'libpam0g libraries/restart-without-asking boolean true'
      - 'libssl3 libraries/restart-without-asking boolean true'
      - 'libssl1.1 libraries/restart-without-asking boolean true'
    extra_debconf_preseed: []            # add your own site-specific answers

  pre_tasks:

    # -------------------------------------------------------------------
    # PRE-FLIGHT CHECKS
    # -------------------------------------------------------------------
    - name: Skip hosts that are already on Ubuntu 24.04
      ansible.builtin.meta: end_host
      when:
        - ansible_distribution == 'Ubuntu'
        - ansible_distribution_version is version('24.04', '>=')

    - name: Abort if host is not Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('22.04', '==')
        fail_msg: >-
          Host is {{ ansible_distribution }} {{ ansible_distribution_version }},
          expected Ubuntu 22.04. Refusing to upgrade.

    - name: Record the filesystem backing /
      ansible.builtin.set_fact:
        root_fs: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first | default(None) }}"

    - name: Abort if / was not found in the gathered mounts
      ansible.builtin.assert:
        that:
          - root_fs is not none
          - root_fs.size_available is defined
        fail_msg: >-
          Could not determine free space on / from ansible_mounts. Refusing to
          start an upgrade without a disk-space check.

    # /boot is frequently a small separate partition; a full /boot is one of
    # the most common ways a release upgrade dies half-finished.
    - name: Record the filesystem backing /boot
      ansible.builtin.set_fact:
        boot_fs: "{{ ansible_mounts | selectattr('mount', 'equalto', '/boot') | first | default(root_fs) }}"

    - name: Check free disk space on / and /boot
      ansible.builtin.assert:
        that:
          - (root_fs.size_available / 1024 / 1024) | int >= (required_free_space_mb | int)
          - (boot_fs.size_available / 1024 / 1024) | int >= (required_boot_free_space_mb | int)
        fail_msg: >-
          Not enough free space:
          / has {{ (root_fs.size_available / 1024 / 1024) | int }} MB
          (need {{ required_free_space_mb }} MB),
          {{ boot_fs.mount }} has {{ (boot_fs.size_available / 1024 / 1024) | int }} MB
          (need {{ required_boot_free_space_mb }} MB on /boot).

    # Use the mirror the host is actually configured against — hard-coding
    # archive.ubuntu.com falsely fails hosts on regional or internal mirrors.
    - name: Determine the Ubuntu archive mirror configured on this host
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {
            awk '/^deb(-src)?[[:space:]]/ {print $2}' /etc/apt/sources.list 2>/dev/null
            awk '/^URIs:/ {print $2}' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null
          } | grep -v '^$' | head -n1
        executable: /bin/bash
      register: detected_mirror
      changed_when: false
      failed_when: false

    - name: Decide which URL proves the 24.04 archive is reachable
      ansible.builtin.set_fact:
        noble_release_url: >-
          {{ archive_check_url if (archive_check_url | length > 0)
             else ((detected_mirror.stdout | trim | regex_replace('/+$', ''))
                   ~ '/dists/noble/Release') }}

    - name: Verify the 24.04 (noble) archive is reachable from this host
      ansible.builtin.uri:
        url: "{{ noble_release_url }}"
        method: HEAD
        timeout: "{{ archive_check_timeout }}"
      register: archive_check
      retries: 3
      delay: 5
      until: archive_check is succeeded
      when: detected_mirror.stdout | trim | length > 0 or archive_check_url | length > 0

    # do-release-upgrade does NOT fetch its own upgrade tool from the mirror
    # configured on the host — it fetches the URL named in meta-release, which
    # points at archive.ubuntu.com. A fleet behind an internal mirror can
    # therefore pass every check above and still fail, because that one host
    # is the only thing the firewall does not allow. Check it explicitly:
    # the failure it causes is a bare rc=1 in ~10s with no output at all.
    - name: Check the host can fetch the release upgrader itself
      ansible.builtin.shell:
        cmd: |
          python3 - noble <<'PY'
          import configparser, os, sys, urllib.request

          target = sys.argv[1]
          meta = "http://changelogs.ubuntu.com/meta-release-lts"
          cfg = "/etc/update-manager/meta-release"
          if os.path.exists(cfg):
              cp = configparser.ConfigParser()
              try:
                  cp.read(cfg)
                  meta = cp.get("METARELEASE", "uri_lts", fallback=meta)
              except configparser.Error:
                  pass

          try:
              body = urllib.request.urlopen(meta, timeout=30).read()
          except Exception as exc:
              sys.exit("cannot fetch the release list %s: %s" % (meta, exc))

          urls = []
          for block in body.decode("utf-8", "replace").split("\n\n"):
              if ("Dist: %s" % target) in block.splitlines():
                  urls += [ln.split(None, 1)[1].strip() for ln in block.splitlines()
                           if ln.startswith(("UpgradeTool:", "UpgradeToolSignature:"))]
          if not urls:
              sys.exit("no UpgradeTool entry for '%s' in %s" % (target, meta))

          # Fetch a few real bytes rather than just HEAD: an intercepting
          # proxy happily answers HEAD with 200 and then serves an HTML
          # error page for the GET. The upgrader would download that,
          # fail to verify its signature, and abort in seconds with no
          # output — the exact symptom this check exists to explain.
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"Range": "bytes=0-511"})
                  head = urllib.request.urlopen(req, timeout=30).read(512)
              except Exception as exc:
                  sys.exit("cannot fetch the upgrade tool %s: %s" % (url, exc))
              if url.endswith(".gz") and not head.startswith(b"\x1f\x8b"):
                  sys.exit("%s did not return gzip data (got %r...) — something "
                           "is intercepting this request" % (url, head[:40]))
              # The .gpg is binary OpenPGP whose leading byte varies, so only
              # rule out the failure that actually happens: an HTML error page.
              if b"<html" in head[:512].lower() or b"<!doctype" in head[:512].lower():
                  sys.exit("%s returned an HTML page rather than the file — "
                           "something is intercepting this request" % url)
              print("reachable and intact: %s" % url)
          PY
        executable: /bin/bash
      register: upgrade_tool_check
      changed_when: false
      failed_when: false
      when: check_upgrade_tool_reachable | bool

    - name: Abort if the release upgrader cannot be downloaded
      ansible.builtin.assert:
        that:
          - upgrade_tool_check.rc == 0
        fail_msg: >-
          {{ inventory_hostname }} cannot download the release upgrader, so
          do-release-upgrade would fail immediately with an empty error:
          {{ (upgrade_tool_check.stderr | default('')) | trim }}
          Note this URL is archive.ubuntu.com, NOT the mirror in
          /etc/apt/sources.list — allow it through the firewall/proxy, or
          point /etc/update-manager/meta-release at an internal copy.
      when: check_upgrade_tool_reachable | bool

    - name: List packages held back from upgrading
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: held_packages
      changed_when: false

    - name: Abort if packages are held (the release upgrader refuses to run)
      ansible.builtin.assert:
        that:
          - held_packages.stdout | trim | length == 0
        fail_msg: >-
          These packages are held on {{ inventory_hostname }} and will make
          do-release-upgrade abort:
          {{ held_packages.stdout_lines | join(', ') }}.
          Unhold them (apt-mark unhold ...) or re-run with
          -e fail_on_held_packages=false to proceed anyway.
      when: fail_on_held_packages | bool

  tasks:

    - block:

        # ---------------------------------------------------------------
        # STEP 0 — Make the machine safe to run a long unattended upgrade
        #          on: no competing apt runs, no interactive prompts.
        # ---------------------------------------------------------------
        - name: Mask the periodic apt timers so they cannot grab the dpkg lock
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            masked: true
          loop:
            - apt-daily.timer
            - apt-daily-upgrade.timer
            - unattended-upgrades.service
          failed_when: false

        # dpkg/apt take fcntl(F_SETLK) locks, which flock(1) cannot see, and
        # fuser(1) lives in psmisc, which is absent from minimal cloud images.
        # Probe the locks the same way apt does instead.
        - name: Wait for any running apt/dpkg operation to release its locks
          ansible.builtin.shell:
            cmd: |
              python3 - "{{ lock_wait_timeout }}" <<'PY'
              import fcntl, os, sys, time
              deadline = time.time() + int(sys.argv[1])
              locks = ("/var/lib/dpkg/lock-frontend",
                       "/var/lib/dpkg/lock",
                       "/var/lib/apt/lists/lock")
              while True:
                  busy = []
                  for path in locks:
                      if not os.path.exists(path):
                          continue
                      try:
                          fd = os.open(path, os.O_RDWR | os.O_CREAT, 0o640)
                      except OSError:
                          continue
                      try:
                          fcntl.lockf(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                          fcntl.lockf(fd, fcntl.LOCK_UN)
                      except OSError:
                          busy.append(path)
                      finally:
                          os.close(fd)
                  if not busy:
                      sys.exit(0)
                  if time.time() >= deadline:
                      sys.stderr.write("still locked: %s\n" % ", ".join(busy))
                      sys.exit(1)
                  time.sleep(5)
              PY
            executable: /bin/bash
          changed_when: false

        - name: Install the temporary apt non-interactive configuration
          ansible.builtin.copy:
            dest: "{{ apt_noninteractive_conf }}"
            owner: root
            group: root
            mode: '0644'
            content: |
              // Installed by Ansible for the duration of the 22.04 -> 24.04
              // release upgrade, and removed again once it completes.
              // force-confdef + force-confold = answer every conffile prompt
              // with "keep the version currently on disk", which is the
              // non-destructive choice; the maintainer's version is still
              // written alongside as *.dpkg-dist for later review.
              Dpkg::Options {
                  "--force-confdef";
                  "--force-confold";
              };
              APT::Get::Assume-Yes "true";
              Dpkg::Use-Pty "0";

        # needrestart is absent from minimal/cloud images, so this directory
        # is not guaranteed to exist. Create it rather than skipping: the
        # 22.04 -> 24.04 upgrade can pull needrestart in as a dependency, and
        # pre-seeding the config means it is already governed by the time it
        # first runs. dpkg unpacks happily into an existing directory.
        - name: Ensure the needrestart drop-in directory exists
          ansible.builtin.file:
            path: "{{ needrestart_conf | dirname }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install the temporary needrestart configuration
          ansible.builtin.copy:
            dest: "{{ needrestart_conf }}"
            owner: root
            group: root
            mode: '0644'
            content: |
              # Installed by Ansible for the duration of the release upgrade.
              # 'a' = restart outdated services automatically instead of
              # showing the interactive checklist that blocks dpkg.
              $nrconf{restart} = 'a';
              # Suppress the "a newer kernel is available" pager/dialog; the
              # playbook reboots explicitly at the end anyway.
              $nrconf{kernelhints} = -1;
              $nrconf{ucodehints} = 0;
              1;

        - name: Pre-answer the debconf questions that would otherwise block
          ansible.builtin.shell:
            cmd: debconf-set-selections
            stdin: "{{ (debconf_preseed + extra_debconf_preseed) | join('\n') }}\n"
          changed_when: true

        - name: Repair any dpkg state left half-configured by an earlier run
          ansible.builtin.command:
            cmd: dpkg --configure -a --force-confdef --force-confold
          environment: "{{ apt_noninteractive_env }}"
          changed_when: false

        - name: Resolve any broken dependencies before starting
          ansible.builtin.command:
            cmd: apt-get -y --fix-broken install
          environment: "{{ apt_noninteractive_env }}"
          changed_when: false

        # ---------------------------------------------------------------
        # STEP 1 — Bring 22.04 fully up to date first (required by the
        #          release upgrader) and reboot if a new kernel landed.
        # ---------------------------------------------------------------
        - name: Update apt cache and apply all pending 22.04 updates
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist
            autoremove: true
            autoclean: true
            dpkg_options: 'force-confdef,force-confold'
          environment: "{{ apt_noninteractive_env }}"
          async: "{{ dist_upgrade_timeout }}"
          poll: "{{ dist_upgrade_poll }}"

        - name: Check whether a reboot is required before the release upgrade
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required_pre

        - name: Reboot to load the latest 22.04 kernel
          ansible.builtin.reboot:
            reboot_timeout: "{{ reboot_timeout }}"
            post_reboot_delay: 15
            msg: "Rebooting before Ubuntu release upgrade (Ansible)"
          when: reboot_required_pre.stat.exists

        # ---------------------------------------------------------------
        # STEP 1b — Merge /usr.
        #
        # Ubuntu 24.04 refuses to upgrade a host that still has the
        # historical split layout (/bin, /sbin, /lib as real directories
        # rather than symlinks into /usr):
        #
        #   ERROR Cannot upgrade system with unmerged /usr
        #
        # do-release-upgrade aborts about ten seconds in, and because the
        # non-interactive frontend logs to main.log rather than stdout, the
        # visible symptom is a bare rc=1 with no output.
        #
        # Hosts whose lineage predates 22.04 — installed as 18.04/20.04 and
        # upgraded since — are typically unmerged. Images installed fresh as
        # 22.04 are already merged, which is why this hits some of a fleet
        # and not others.
        #
        # Installing usrmerge performs the conversion in its postinst. It is
        # the fix Ubuntu's own upgrader tells you to apply, but it is still a
        # real change to the filesystem layout, so it is switchable with
        # -e merge_usr=false.
        # ---------------------------------------------------------------
        - name: Check whether /usr is already merged
          ansible.builtin.stat:
            path: /bin
          register: bin_dir

        - name: Abort if /usr is unmerged and merging was disabled
          ansible.builtin.assert:
            that:
              - bin_dir.stat.islnk | default(false)
            fail_msg: >-
              {{ inventory_hostname }} still has the split /usr layout, which
              Ubuntu 24.04 refuses to upgrade. Drop -e merge_usr=false to let
              the playbook install usrmerge, or install it by hand first.
          when: not (merge_usr | bool)

        - name: Merge /usr by installing usrmerge
          ansible.builtin.apt:
            name: usrmerge
            state: present
            update_cache: true
          environment: "{{ apt_noninteractive_env }}"
          when:
            - merge_usr | bool
            - not (bin_dir.stat.islnk | default(false))
          register: usrmerge_result

        - name: Re-check the /usr layout after merging
          ansible.builtin.stat:
            path: /bin
          register: bin_dir_post
          when: usrmerge_result is changed

        # convert-usrmerge deliberately makes no changes when it finds a file
        # present in both /lib and /usr/lib, so a "successful" package install
        # does not by itself prove the layout changed. Check the result.
        - name: Confirm /usr really is merged now
          ansible.builtin.assert:
            that:
              - bin_dir_post.stat.islnk | default(false)
            fail_msg: >-
              usrmerge was installed on {{ inventory_hostname }} but /bin is
              still a real directory, so the conversion did not run to
              completion. convert-usrmerge aborts without changing anything
              when a file exists in both /lib and /usr/lib (or /bin and
              /usr/bin) — resolve those duplicates by hand, then re-run.
            success_msg: >-
              /usr is now merged on {{ inventory_hostname }}
              (/bin -> {{ bin_dir_post.stat.lnk_target | default('usr/bin') }}).
          when: usrmerge_result is changed

        # ---------------------------------------------------------------
        # STEP 2 — Prepare the release upgrader for unattended operation
        # ---------------------------------------------------------------
        - name: Ensure update-manager-core is installed
          ansible.builtin.apt:
            name: update-manager-core
            state: present
          environment: "{{ apt_noninteractive_env }}"

        - name: Allow upgrades to the next LTS release (Prompt=lts)
          ansible.builtin.lineinfile:
            path: /etc/update-manager/release-upgrades
            regexp: '^\s*Prompt\s*='
            line: 'Prompt=lts'
            create: true
            owner: root
            group: root
            mode: '0644'

        - name: Remove any stale release-upgrader lock/state from failed runs
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /var/lib/update-manager/meta-release-lts
            - /var/lib/ubuntu-release-upgrader/release-upgrade-available

        # Catch the silent no-op case: if the meta-release server does not
        # offer 24.04 to this host, do-release-upgrade exits 0 having done
        # nothing, and without this check we would reboot and then fail with a
        # confusing "still on 22.04" message.
        - name: Confirm the upgrader actually offers a new release
          ansible.builtin.command:
            cmd: do-release-upgrade -c -m server
          environment: "{{ apt_noninteractive_env }}"
          register: release_check
          changed_when: false
          failed_when: false
          async: 300
          poll: 10

        - name: Abort if no new release is offered to this host
          ansible.builtin.assert:
            that:
              - >-
                'New release' in ((release_check.stdout | default('')) ~
                                  (release_check.stderr | default('')))
            fail_msg: >-
              do-release-upgrade -c reports no new release for
              {{ inventory_hostname }} (rc={{ release_check.rc | default('?') }}):
              {{ (release_check.stdout | default('') ~ ' ' ~ release_check.stderr | default('')) | trim }}
              Check Prompt=lts in /etc/update-manager/release-upgrades and that
              changelogs.ubuntu.com is reachable.

        # ---------------------------------------------------------------
        # STEP 3 — Run the release upgrade completely non-interactively.
        #          DistUpgradeViewNonInteractive answers every prompt with
        #          the default and keeps existing config files (confold).
        # ---------------------------------------------------------------
        - name: Run do-release-upgrade (non-interactive, this takes 30-90 min)
          ansible.builtin.command:
            cmd: do-release-upgrade -f DistUpgradeViewNonInteractive -m server
          environment: "{{ apt_noninteractive_env }}"
          async: "{{ release_upgrade_timeout }}"
          poll: "{{ release_upgrade_poll }}"
          register: release_upgrade
          # NOTE: failed_when replaces the module's own failure check, so it
          # must also treat "no rc at all" (async timeout / unreachable) as a
          # failure. Otherwise a timed-out upgrade would be reported OK and
          # the play would reboot a half-upgraded host.
          failed_when: >-
            release_upgrade.rc is not defined
            or release_upgrade.rc != 0
            or 'No new release found' in (release_upgrade.stdout | default(''))

        # ---------------------------------------------------------------
        # STEP 4 — Reboot into 24.04 and verify
        # ---------------------------------------------------------------
        - name: Reboot into Ubuntu 24.04
          ansible.builtin.reboot:
            reboot_timeout: "{{ reboot_timeout }}"
            post_reboot_delay: 30
            msg: "Rebooting to complete Ubuntu 24.04 upgrade (Ansible)"

        - name: Re-gather facts after the upgrade
          ansible.builtin.setup:

        - name: Verify the host is now running Ubuntu 24.04
          ansible.builtin.assert:
            that:
              - ansible_distribution_version is version('24.04', '>=')
            fail_msg: >-
              Upgrade appears to have failed — host still reports
              {{ ansible_distribution }} {{ ansible_distribution_version }}.
              Check /var/log/dist-upgrade/ on the host.
            success_msg: >-
              Host successfully upgraded to
              {{ ansible_distribution }} {{ ansible_distribution_version }}.

        - name: Check for packages left unconfigured by the upgrade
          ansible.builtin.command:
            cmd: dpkg --audit
          register: dpkg_audit
          changed_when: false
          failed_when: false

        - name: Fail if any package is still half-installed or unconfigured
          ansible.builtin.assert:
            that:
              - dpkg_audit.stdout | trim | length == 0
            fail_msg: >-
              dpkg reports packages in a broken state after the upgrade on
              {{ inventory_hostname }}:
              {{ dpkg_audit.stdout | trim }}

        # ---------------------------------------------------------------
        # STEP 5 — Post-upgrade cleanup
        # ---------------------------------------------------------------
        # By this point the host has already rebooted into 24.04, been
        # verified, and passed dpkg --audit. Tidying up obsolete packages is
        # housekeeping, not part of the upgrade succeeding — and it is the
        # step most likely to trip on something outside our control, because
        # removing an obsolete vendor package runs that vendor's prerm
        # script. Monitoring and security agents are frequent offenders.
        #
        # Failing the host here reports a successful upgrade as a failure,
        # so these steps are tolerant and reported rather than fatal. Set
        # -e fail_on_cleanup_errors=true to restore strict behaviour.
        - name: Refresh the apt cache after the upgrade
          ansible.builtin.command:
            cmd: apt-get update
          environment: "{{ apt_noninteractive_env }}"
          register: post_apt_update
          changed_when: true
          failed_when: false

        - name: Remove packages left over from the old release
          ansible.builtin.command:
            cmd: apt-get -y autoremove --purge
          environment: "{{ apt_noninteractive_env }}"
          register: post_autoremove
          changed_when: "'Removing ' in (post_autoremove.stdout | default(''))"
          failed_when: false

        - name: Clean obsolete files from the package cache
          ansible.builtin.command:
            cmd: apt-get -y autoclean
          environment: "{{ apt_noninteractive_env }}"
          register: post_autoclean
          changed_when: false
          failed_when: false

        - name: Record whether cleanup hit any problems
          ansible.builtin.set_fact:
            cleanup_failed: >-
              {{ (post_apt_update.rc | default(0)) != 0
                 or (post_autoremove.rc | default(0)) != 0
                 or (post_autoclean.rc | default(0)) != 0 }}
            cleanup_error_text: "{{ ((post_apt_update.stderr_lines | default([]))
                                     + (post_autoremove.stderr_lines | default([]))
                                     + (post_autoclean.stderr_lines | default([])))[-15:]
                                    | join('\n  ') }}"

        - name: Report cleanup problems without failing the host
          ansible.builtin.debug:
            msg: |
              Post-upgrade cleanup did not fully succeed on {{ inventory_hostname }}.
              The upgrade itself is COMPLETE and verified — this step is
              housekeeping only, and the host is usable.
                apt-get update            rc={{ post_apt_update.rc | default('n/a') }}
                apt-get autoremove --purge rc={{ post_autoremove.rc | default('n/a') }}
                apt-get autoclean         rc={{ post_autoclean.rc | default('n/a') }}
              Last error output:
                {{ cleanup_error_text }}
              Re-run 'apt-get -y autoremove --purge' by hand once the
              third-party repositories have been restored.
          when: cleanup_failed | bool

        - name: Fail on cleanup problems when strict mode is requested
          ansible.builtin.fail:
            msg: >-
              Post-upgrade cleanup failed on {{ inventory_hostname }} and
              fail_on_cleanup_errors is true. See the report above.
          when:
            - cleanup_failed | bool
            - fail_on_cleanup_errors | bool

        - name: Check whether a final reboot is required
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required_post

        - name: Final reboot if cleanup requires it
          ansible.builtin.reboot:
            reboot_timeout: "{{ reboot_timeout }}"
            post_reboot_delay: 15
          when: reboot_required_post.stat.exists

        - name: Report success
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} upgraded to
              {{ ansible_distribution }} {{ ansible_distribution_version }}
              (kernel {{ ansible_kernel }})

      rescue:
        # Which task actually failed decides what is worth reporting. Any
        # failure used to be reported as a do-release-upgrade failure and
        # answered with a dump of main.log — so a post-upgrade housekeeping
        # error came back describing an upgrade that had in fact succeeded,
        # buried under eighty lines of an unrelated log.
        - name: Record which task failed
          ansible.builtin.set_fact:
            failed_task_name: "{{ ansible_failed_task.name | default('unknown') }}"
            release_upgrade_was_the_failure: >-
              {{ 'do-release-upgrade' in (ansible_failed_task.name | default('')) }}

        # The real error, first and unconditionally. Whatever went wrong,
        # this is the line that explains it.
        - name: Show the actual error from the failed task
          ansible.builtin.debug:
            msg: |
              Task that failed: {{ failed_task_name }}
              Error: {{ ansible_failed_result.msg | default('(no message)') }}
              {{ (ansible_failed_result.stderr | default('')) | trim }}

        # raw runs over the shell and needs no python on the target, so it
        # still answers when a broken interpreter is the reason we are here.
        - name: Check which release the host is actually running now
          ansible.builtin.raw: . /etc/os-release && echo "$VERSION_ID"
          register: raw_release
          changed_when: false
          failed_when: false

        - name: Summarise how do-release-upgrade ended
          ansible.builtin.debug:
            msg: >-
              Host now reports Ubuntu
              {{ raw_release.stdout | default('unknown') | trim }}.
              {{ ('The release upgrade itself COMPLETED — only the post-upgrade'
              ~ ' bookkeeping failed, so the host still needs a reboot and'
              ~ ' cleanup. Re-run this playbook: it will pick the host up on'
              ~ ' 24.04 and finish the job.')
              if ('24.04' in (raw_release.stdout | default('')))
              else (('do-release-upgrade did not finish within '
              ~ release_upgrade_timeout ~ 's and was abandoned (async timeout)'
              ~ ' — re-run with a larger -e release_upgrade_timeout if the'
              ~ ' host is simply slow.')
              if release_upgrade.rc is not defined
              else ('do-release-upgrade exited rc=' ~ release_upgrade.rc)) }}
          when: release_upgrade is defined

        # The upgrader's own stdout usually names the blocker (unresolvable
        # dependencies, a third-party repo, no space) more plainly than
        # main.log does.
        - name: Show the tail of the upgrader's own output
          ansible.builtin.debug:
            msg: "{{ (release_upgrade.stdout_lines | default([]))[-40:] +
                     (release_upgrade.stderr_lines | default([]))[-40:] }}"
          when: release_upgrade is defined

        - name: Collect the tail of the release upgrader log
          ansible.builtin.command:
            cmd: tail -n 80 /var/log/dist-upgrade/main.log
          register: upgrade_log
          changed_when: false
          failed_when: false
          when: release_upgrade_was_the_failure | bool

        # An empty stdout from do-release-upgrade is normal — the
        # non-interactive frontend logs to main.log instead of the terminal —
        # so pull the actual error out rather than telling the operator to go
        # and find it. Also report the log's age: main.log can be left over
        # from an earlier attempt, and reading a stale one sends you chasing
        # a problem you already fixed.
        - name: Extract the error lines from the upgrader log
          ansible.builtin.shell:
            cmd: |
              log=/var/log/dist-upgrade/main.log
              [ -f "$log" ] || { echo "no main.log — the upgrader never started"; exit 0; }
              echo "main.log last modified: $(date -r "$log" '+%Y-%m-%d %H:%M:%S') (now $(date '+%Y-%m-%d %H:%M:%S'))"
              grep -aE ' (ERROR|CRITICAL) |Traceback|unresolvable|Cannot upgrade|No space left' \
                "$log" | tail -n 25 | cut -c1-300
            executable: /bin/bash
          register: upgrade_errors
          changed_when: false
          failed_when: false
          when: release_upgrade_was_the_failure | bool

        - name: Show the errors found in the upgrader log
          ansible.builtin.debug:
            var: upgrade_errors.stdout_lines
          when:
            - release_upgrade_was_the_failure | bool
            - upgrade_errors.stdout | default('') | trim | length > 0

        # On a fleet run the per-host output scrolls past; leave every failed
        # host's log on the controller under ./dist-upgrade-logs/<host>/.
        - name: Retrieve the upgrader logs to the controller
          ansible.builtin.fetch:
            src: "/var/log/dist-upgrade/{{ item }}"
            dest: "dist-upgrade-logs/"
            flat: false
            fail_on_missing: false
          loop:
            - main.log
            - apt.log
            - apt-term.log
          failed_when: false

        # Only when the upgrader actually got far enough to write one — a
        # failure in the preparation steps has no dist-upgrade log, and
        # pointing the operator at an empty directory wastes their time.
        - name: Show the release upgrader log tail
          ansible.builtin.debug:
            var: upgrade_log.stdout_lines
          when: (upgrade_log.rc | default(1)) == 0

        # Both must be double-quoted YAML scalars so \n is a real newline; in
        # a literal block ("|") it stays a backslash-n and the whole report
        # collapses onto one unreadable line.
        - name: Assemble the diagnostic report
          ansible.builtin.set_fact:
            failed_error_text: "{{ (ansible_failed_result.msg | default('(no message)')) ~ '\n' ~
                                   ((ansible_failed_result.stderr | default('')) | trim) }}"
            upgrade_error_text: "{{ (upgrade_errors.stdout_lines | default([])) | join('\n') }}"
            upgrade_tail_text: "{{ (upgrade_log.stdout_lines | default([]))[-30:] | join('\n') }}"

        # Two shapes of report, because two very different things can fail.
        #
        # If do-release-upgrade failed, its own stdout is empty by design and
        # main.log holds the answer, so that goes in the message.
        #
        # If anything else failed — the host is already upgraded and verified
        # by then — main.log describes an upgrade that SUCCEEDED and is pure
        # noise. Report the failing task's own error instead.
        - name: Fail the host after reporting the release upgrade error
          ansible.builtin.fail:
            msg: |-
              Release upgrade failed on {{ inventory_hostname }} at task
              "{{ failed_task_name }}".

              do-release-upgrade writes nothing to stdout under
              DistUpgradeViewNonInteractive; everything below comes from
              /var/log/dist-upgrade/main.log on the host.

              ===== matching error lines =====
              {{ upgrade_error_text | default('', true) | trim
                 | default('(no matching lines — see the tail below)', true) }}

              ===== last 30 lines of main.log =====
              {{ upgrade_tail_text | default('', true) | trim
                 | default('(main.log absent — the upgrader never started)', true) }}
              ================================
          when: release_upgrade_was_the_failure | bool

        - name: Fail the host after reporting a post-upgrade error
          ansible.builtin.fail:
            msg: |-
              {{ inventory_hostname }} failed at task "{{ failed_task_name }}".

              This is NOT a do-release-upgrade failure — the release upgrade
              had already completed by this point, so /var/log/dist-upgrade/
              describes a successful upgrade and is not shown.
              The host currently reports Ubuntu
              {{ raw_release.stdout | default('unknown') | trim }}.

              ===== error from the failed task =====
              {{ failed_error_text | trim }}
              ======================================
          when: not (release_upgrade_was_the_failure | bool)

      always:
        # Leaving force-confold in place permanently would silently keep stale
        # config files forever, and leaving the apt timers masked would stop
        # security updates. Both are undone whether we succeeded or failed.
        # ignore_errors, because a failure here must not skip the unmask
        # tasks below it: a task that fails inside always: stops the rest of
        # the always: block, and leaving the apt timers masked means the host
        # quietly stops receiving security updates.
        - name: Remove the temporary non-interactive overrides
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ apt_noninteractive_conf }}"
            - "{{ needrestart_conf }}"
          ignore_errors: true

        - name: Unmask and restart the periodic apt timers
          ansible.builtin.systemd:
            name: "{{ item }}"
            masked: false
            state: started
            daemon_reload: true
          loop:
            - apt-daily.timer
            - apt-daily-upgrade.timer
          failed_when: false

        - name: Unmask unattended-upgrades
          ansible.builtin.systemd:
            name: unattended-upgrades.service
            masked: false
          failed_when: false
